<!DOCTYPE html>
<html lang="zh-CN" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<title>AI视频概念地图</title>
<style>
/* ═══════════════════════════════════════════════════════════════
 * style.css —— 深色电影感主题
 * 只改观感请改这里；改内容去 concepts.js，改交互去 app.js。
 * 字号三档由 html[data-fs] 控制（topbar 的 Aa 按钮切换）。
 * ═══════════════════════════════════════════════════════════════ */

:root {
  --bg:        #0B0C10;
  --bg-2:      #0F1116;
  --card:      #14161C;
  --card-2:    #191C23;
  --line:      rgba(255, 255, 255, .07);
  --line-2:    rgba(255, 255, 255, .13);

  --tx:        #ECE9E4;
  --tx-2:      #9BA1AA;
  --tx-3:      #6A7079;

  --amber:     #E8B25C;
  --amber-dim: rgba(232, 178, 92, .13);
  --cyan:      #5FC9D6;
  --cyan-dim:  rgba(95, 201, 214, .13);

  --fs: 15.5px;     /* 正文基准，由 data-fs 覆盖 */
  --lh: 1.78;
  --r: 14px;
  --tabh: 62px;

  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
}

/* ── 字号三档 ───────────────────────────────── */
html[data-fs="s"] { --fs: 14px;   --lh: 1.72; }
html[data-fs="m"] { --fs: 15.5px; --lh: 1.78; }
html[data-fs="l"] { --fs: 17.5px; --lh: 1.86; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC",
               "Microsoft YaHei", sans-serif;
  font-size: var(--fs);
  line-height: var(--lh);
  overscroll-behavior: none;
}

/* 顶部一抹琥珀柔光 + 底部暗角，营造放映感 */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(120% 42% at 50% -12%, rgba(232, 178, 92, .11), transparent 62%),
    radial-gradient(120% 55% at 50% 118%, rgba(0, 0, 0, .55), transparent 60%);
}

#app {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column;
}

/* ── 顶栏 ───────────────────────────────────── */
.topbar {
  flex: 0 0 auto;
  padding: 14px 16px 10px;
  background: rgba(11, 12, 16, .88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand-row { display: flex; align-items: flex-start; gap: 10px; }
.brand { flex: 1 1 auto; min-width: 0; }

.brand-t {
  font-size: 1.16em; font-weight: 650; letter-spacing: .3px;
  display: flex; align-items: center; gap: 8px;
}
.brand-t::before {
  content: ""; width: 4px; height: 15px; border-radius: 2px;
  background: linear-gradient(180deg, var(--amber), rgba(232, 178, 92, .25));
  flex: 0 0 auto;
}
.brand-s {
  font-size: .76em; color: var(--tx-3); margin-top: 3px; padding-left: 12px;
}

.fsbtn {
  flex: 0 0 auto;
  font-family: var(--mono); font-size: .82em;
  color: var(--amber);
  background: var(--amber-dim);
  border: 1px solid rgba(232, 178, 92, .3);
  border-radius: 9px; padding: 5px 10px; cursor: pointer;
}
.fsbtn:active { transform: scale(.94); }

/* 搜索框 */
.search {
  margin-top: 11px; position: relative;
  display: flex; align-items: center;
}
.search .mag {
  position: absolute; left: 11px; color: var(--tx-3);
  font-size: .9em; pointer-events: none;
}
#q {
  width: 100%;
  padding: 10px 34px 10px 32px;
  font-size: .93em; font-family: inherit; color: var(--tx);
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 11px;
  outline: none;
  -webkit-appearance: none;
}
#q::placeholder { color: var(--tx-3); }
#q:focus { border-color: rgba(232, 178, 92, .5); background: var(--card-2); }
#qclear {
  position: absolute; right: 6px;
  width: 24px; height: 24px; line-height: 1;
  border: 0; border-radius: 50%; cursor: pointer;
  background: transparent; color: var(--tx-3); font-size: .95em;
}

/* ── 主区 ───────────────────────────────────── */
main {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 0 calc(var(--tabh) + 20px);
}
.view { padding: 0 14px; }

/* 搜索前的位置提示（上次查看） */
.resume {
  margin: 14px 0 4px;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 13px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 2px solid var(--cyan);
  border-radius: 11px;
  font-size: .85em; color: var(--tx-2);
  cursor: pointer;
}
.resume b { color: var(--tx); font-weight: 600; }

/* 开篇语 */
.intro {
  margin: 14px 0 6px;
  font-size: .9em; color: var(--tx-2);
  padding: 12px 14px;
  background: linear-gradient(180deg, var(--card), transparent);
  border-left: 2px solid var(--line-2);
  border-radius: 0 11px 11px 0;
}

/* 阶段条 */
.chips {
  position: sticky; top: 0; z-index: 5;
  display: flex; gap: 7px; overflow-x: auto;
  padding: 12px 0 11px;
  margin: 0 -14px; padding-left: 14px; padding-right: 14px;
  background: linear-gradient(180deg, var(--bg) 72%, rgba(11, 12, 16, 0));
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font-size: .83em; color: var(--tx-2); white-space: nowrap;
  background: var(--card); border: 1px solid var(--line);
}
.chip:active { transform: scale(.95); }
.chip.amber { color: var(--amber); border-color: rgba(232, 178, 92, .28); }
.chip.cyan  { color: var(--cyan);  border-color: rgba(95, 201, 214, .28); }

/* 篇标题 */
.parthead { margin: 22px 0 12px; }
.parthead .badge {
  display: inline-block;
  font-family: var(--mono); font-size: .72em; letter-spacing: .12em;
  padding: 2px 8px; border-radius: 5px; margin-bottom: 8px;
}
.parthead.amber .badge { color: var(--amber); background: var(--amber-dim); }
.parthead.cyan  .badge { color: var(--cyan);  background: var(--cyan-dim); }
.parthead h2 {
  margin: 0; font-size: 1.28em; font-weight: 680; letter-spacing: .4px;
}
.parthead .pdesc {
  margin-top: 7px; font-size: .85em; color: var(--tx-2);
}

/* 分组线卡（流程图主体） */
.linecard {
  position: relative;
  margin: 0 0 14px;
  padding: 14px 14px 13px;
  background: linear-gradient(180deg, var(--card), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: var(--r);
  scroll-margin-top: 62px;
}
.linecard::before {           /* 左侧竖线 = 线路感 */
  content: ""; position: absolute; left: 0; top: 16px; bottom: 16px;
  width: 2px; border-radius: 0 2px 2px 0;
}
.linecard.amber::before { background: linear-gradient(180deg, var(--amber), rgba(232, 178, 92, .06)); }
.linecard.cyan::before  { background: linear-gradient(180deg, var(--cyan),  rgba(95, 201, 214, .06)); }

.linecard-hd {
  display: flex; align-items: baseline; gap: 9px; margin-bottom: 11px;
}
.linecard-hd .no {
  font-family: var(--mono); font-size: .78em; color: var(--tx-3);
  flex: 0 0 auto;
}
.linecard-hd .nm { font-weight: 640; font-size: 1.02em; }
.linecard-hd .sb { font-size: .78em; color: var(--tx-3); margin-left: auto; text-align: right; }

/* 节点胶囊 */
.nodes { display: flex; flex-wrap: wrap; gap: 8px; }
.node {
  display: flex; flex-direction: column; gap: 1px;
  padding: 8px 12px 9px; cursor: pointer;
  border-radius: 11px;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  transition: transform .12s, background .16s, border-color .16s;
}
.node:active { transform: scale(.96); background: #21252D; }
.node .nm { font-size: .9em; font-weight: 560; line-height: 1.35; }
.node .al {
  font-family: var(--mono); font-size: .68em; color: var(--tx-3);
  line-height: 1.3; letter-spacing: .01em;
}
.linecard.amber .node { border-color: rgba(232, 178, 92, .22); }
.linecard.cyan  .node { border-color: rgba(95, 201, 214, .22); }
.linecard.amber .node.hit { border-color: var(--amber); background: var(--amber-dim); }
.linecard.cyan  .node.hit { border-color: var(--cyan);  background: var(--cyan-dim); }

/* 组间流水箭头 */
.arrow {
  display: flex; align-items: center; gap: 8px;
  margin: 2px 0 14px; padding-left: 15px;
  color: var(--tx-3); font-size: .72em;
}
.arrow i {
  font-style: normal; font-family: var(--mono);
  width: 20px; height: 20px; line-height: 19px; text-align: center;
  border: 1px solid var(--line-2); border-radius: 50%;
}

/* 收尾金句 */
.outro {
  margin: 20px 0 6px; padding: 15px 16px;
  border-radius: var(--r);
  background: linear-gradient(135deg, rgba(232, 178, 92, .1), rgba(95, 201, 214, .06));
  border: 1px solid rgba(232, 178, 92, .2);
  font-size: .92em; color: var(--tx);
}
.outro .ol {
  display: block; font-family: var(--mono); font-size: .72em;
  color: var(--amber); letter-spacing: .14em; margin-bottom: 7px;
}

/* ── 列表 / 搜索结果 ───────────────────────── */
.list { padding-top: 6px; }
.item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 13px; margin-bottom: 9px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; cursor: pointer;
}
.item:active { background: var(--card-2); }
.item .it-l { flex: 1 1 auto; min-width: 0; }
.item .it-n { font-weight: 600; font-size: .96em; }
.item .it-a { font-family: var(--mono); font-size: .7em; color: var(--tx-3); margin-top: 2px; }
.item .it-d {
  font-size: .82em; color: var(--tx-2); margin-top: 5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item .it-r { flex: 0 0 auto; padding-top: 2px; }
.star { color: var(--amber); font-size: .95em; }

.sect {
  font-size: .78em; color: var(--tx-3); font-family: var(--mono);
  letter-spacing: .1em; margin: 18px 0 9px;
}
.sect:first-child { margin-top: 12px; }

mark { background: rgba(232, 178, 92, .28); color: var(--amber); border-radius: 3px; padding: 0 2px; }

.empty {
  padding: 46px 20px; text-align: center; color: var(--tx-3); font-size: .88em;
}
.empty .big { font-size: 2.2em; display: block; margin-bottom: 12px; opacity: .5; }
.searchinfo { padding: 14px 2px 4px; font-size: .82em; color: var(--tx-3); }

/* ── 底部 Tab ───────────────────────────────── */
.tabbar {
  flex: 0 0 auto;
  height: var(--tabh);
  display: flex; align-items: stretch;
  background: rgba(11, 12, 16, .94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: transparent; border: 0; cursor: pointer;
  color: var(--tx-3); font-family: inherit; font-size: .74em;
}
.tab .ti { font-size: 1.24em; line-height: 1; }
.tab.active { color: var(--amber); }

/* ── 详情抽屉 ───────────────────────────────── */
.mask {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(0, 0, 0, .58);
  opacity: 0; transition: opacity .24s;
}
.mask.show { opacity: 1; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-height: 88%;
  display: flex; flex-direction: column;
  background: var(--card);
  border-top: 1px solid var(--line-2);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -18px 44px rgba(0, 0, 0, .55);
  transform: translateY(101%);
  transition: transform .3s cubic-bezier(.22, .72, .28, 1);
}
.sheet.show { transform: translateY(0); }

.sheet-hd {
  flex: 0 0 auto; position: relative;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 21px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.sheet-hd .grab {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 9px; width: 36px; height: 4px; border-radius: 2px;
  background: var(--line-2);
}
.sheet-hd-l { flex: 1 1 auto; min-width: 0; }
.sheet-hd-l h2 {
  margin: 0; font-size: 1.24em; font-weight: 680; letter-spacing: .3px;
}
.sheet-hd-l .mono {
  font-family: var(--mono); font-size: .73em; color: var(--tx-3); margin-top: 3px;
}
.sheet-hd-r { flex: 0 0 auto; display: flex; gap: 6px; }
.iconbtn {
  width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
  background: var(--card-2); border: 1px solid var(--line-2);
  color: var(--tx-2); font-size: 1em; line-height: 1;
}
.iconbtn:active { transform: scale(.92); }
.iconbtn.on { color: var(--amber); border-color: rgba(232, 178, 92, .45); background: var(--amber-dim); }

.sheet-body {
  flex: 1 1 auto; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 15px 17px 18px;
}
.tag {
  display: inline-block; font-size: .72em; font-family: var(--mono);
  color: var(--tx-3); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 2px 7px; margin-bottom: 12px;
}
.def { margin: 0 0 16px; font-size: 1.02em; color: var(--tx); }

.ai-block, .why-block {
  padding: 12px 14px; border-radius: 12px; margin-bottom: 12px;
}
.ai-block {
  background: var(--amber-dim);
  border: 1px solid rgba(232, 178, 92, .26);
  border-left: 3px solid var(--amber);
}
.ai-block .lbl {
  display: block; font-size: .73em; font-family: var(--mono);
  letter-spacing: .1em; color: var(--amber); margin-bottom: 6px;
}
.ai-block p { margin: 0; font-size: .93em; color: #F2E6D2; }
.why-block { background: var(--card-2); border: 1px solid var(--line); }
.why-block .lbl {
  display: block; font-size: .73em; font-family: var(--mono);
  letter-spacing: .1em; color: var(--tx-3); margin-bottom: 6px;
}
.why-block p { margin: 0; font-size: .9em; color: var(--tx-2); }

.sheet-ft {
  flex: 0 0 auto;
  display: flex; gap: 8px; padding: 11px 16px 14px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
}
.sheet-ft button {
  flex: 1 1 0; padding: 10px 6px; cursor: pointer;
  font-family: inherit; font-size: .85em; color: var(--tx-2);
  background: var(--card-2); border: 1px solid var(--line-2); border-radius: 10px;
}
.sheet-ft button:active { transform: scale(.97); }
.sheet-ft button.primary { color: var(--amber); border-color: rgba(232, 178, 92, .35); }

/* 复制成功的浮层提示 */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabh) + 26px);
  transform: translate(-50%, 8px);
  z-index: 40;
  padding: 9px 15px; border-radius: 10px;
  background: rgba(30, 33, 40, .96);
  border: 1px solid var(--line-2);
  color: var(--tx); font-size: .84em;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>

<div id="app">

  <!-- ══ 顶栏 ══ -->
  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-t" id="brandTitle">AI视频概念地图</div>
        <div class="brand-s" id="brandSub">从一句话到一部片 · 47 个概念</div>
      </div>
      <button class="fsbtn" id="fsBtn" data-act="fs" title="切换字号">Aa</button>
    </div>
    <div class="search">
      <span class="mag">⌕</span>
      <input id="q" type="search" placeholder="搜概念 / logline / 景别 / 剪辑…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="qclear" data-act="qclear" hidden>✕</button>
    </div>
  </header>

  <!-- ══ 主区 ══ -->
  <main id="main">

    <!-- 地图（默认视图） -->
    <section id="viewMap" class="view">
      <div id="chips" class="chips"></div>
      <div id="resumeBox"></div>
      <div class="intro" id="introBox"></div>
      <div id="map"></div>
      <div class="outro" id="outroBox"><span class="ol">一句话收尾</span></div>
    </section>

    <!-- 概念列表 -->
    <section id="viewList" class="view" hidden>
      <div id="list" class="list"></div>
    </section>

    <!-- 收藏 -->
    <section id="viewFav" class="view" hidden>
      <div id="fav" class="list"></div>
    </section>

    <!-- 搜索结果 -->
    <section id="viewSearch" class="view" hidden>
      <div class="searchinfo" id="searchInfo"></div>
      <div id="results" class="list"></div>
    </section>

  </main>

  <!-- ══ 底部 Tab ══ -->
  <nav class="tabbar">
    <button class="tab active" data-act="tab" data-tab="map"><span class="ti">◈</span>地图</button>
    <button class="tab" data-act="tab" data-tab="list"><span class="ti">☰</span>概念</button>
    <button class="tab" data-act="tab" data-tab="fav"><span class="ti">★</span>收藏</button>
  </nav>

</div>

<!-- ══ 详情抽屉 ══ -->
<div id="mask" class="mask" data-act="mask" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-hd">
    <div class="grab"></div>
    <div class="sheet-hd-l">
      <h2 id="sName"></h2>
      <div class="mono" id="sAlias"></div>
    </div>
    <div class="sheet-hd-r">
      <button class="iconbtn" id="sFav" data-act="fav" title="收藏">☆</button>
      <button class="iconbtn" id="sClose" data-act="close" title="关闭">✕</button>
    </div>
  </div>
  <div class="sheet-body" id="sBody">
    <div class="tag" id="sTag"></div>
    <p class="def" id="sDef"></p>
    <div class="ai-block" id="sAiBox">
      <span class="lbl">AI 里动哪一下</span>
      <p id="sAi"></p>
    </div>
    <div class="why-block" id="sWhyBox">
      <span class="lbl">为什么必须在乎</span>
      <p id="sWhy"></p>
    </div>
  </div>
  <div class="sheet-ft">
    <button id="sPrev" data-act="prev">← 上一个</button>
    <button id="sCopy" class="primary" data-act="copy">复制全文</button>
    <button id="sNext" data-act="next">下一个 →</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>window.APPINFO={mode:"page.html"};</script>

<script>
/* ═══════════════════════════════════════════════════════════════
 * concepts.js —— 全部内容数据（47 条概念）
 *
 * 这个文件就是"内容"，改内容只改这里，不用碰 app.js / style.css。
 * 字段说明：
 *   id    唯一标识（收藏、锚点用，别改已发布的 id）
 *   g     所属分组 id（见 groups）
 *   name  卡片主标题
 *   alias 副标题（中文名或英文名对照，可为空）
 *   tag   分类标签（也会参与搜索）
 *   def   一句话定义
 *   ai    「AI 里动哪一下」——高亮块，可为空
 *   why   「为什么必须在乎」——可为空
 * ═══════════════════════════════════════════════════════════════ */
var DATA = {

  meta: {
    title: "AI视频概念地图",
    subtitle: "从一句话到一部片",
    count: "47 个概念",
    version: "1.0.0"
  },

  /* 开篇语：地图视图顶部显示 */
  intro: "只要是视频，就一定缺不了视听语言。AI 脑子里装着这套知识，但你得比它更清楚——不然片子一出问题，你连该调哪儿都不知道，只能瞎调。",

  /* 收尾语 */
  outro: "AI 能替你做掉 80% 的执行，但替不了你做决定。上面每一个概念，本质都是你必须自己拍板的一次选择——你不选，AI 就替你瞎选。",

  parts: [
    {
      id: "p1",
      badge: "上篇",
      name: "从一句话到一部片",
      desc: "这是一条单向流水线：每一步的产物，就是下一步的原料。你卡在哪一步，往回看一步就找到原因了。",
      accent: "amber"

      def: "相邻镜头的景别要有明显区别。",
      ai: "接两个「差不多的景别」会像跳帧一样难受。",
      why: ""
    },
    {
      id: "transition", g: "g10", name: "转场与节奏", alias: "Transition / Pacing", tag: "剪辑",
      def: "硬切最常用，淡入淡出表时间流逝；节奏＝镜头长度与信息量的配比。",
      ai: "", why: ""
    }
  ]
};

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
 * app.js —— 页面交互逻辑（ES5 写法，兼容性优先）
 *
 *   · 地图 / 概念 / 收藏 三个视图 + 搜索结果视图
 *   · 点节点 → 底部抽屉；抽屉内可上一个 / 下一个 / 收藏 / 复制
 *   · 收藏与「上次查看」存 localStorage
 *   · 与安卓容器通信只用两个通道（不依赖自定义 bridge）：
 *       上报状态：console.log("AJSTATE:{...}")   ← 容器读 console_message
 *       接收指令：window.AJClose / window.AJHome ← 容器 evaluateJavascript
 *                 （两个函数都不返回值，防 loadUrl('javascript:') 把字符串当页面加载）
 * ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var C = DATA.concepts;
  var G = DATA.groups;
  var P = DATA.parts;

  var FS_KEY = 'aivm.fs';
  var FAV_KEY = 'aivm.fav';
  var LAST_KEY = 'aivm.last';

  var byId = {};
  var allIds = [];
  var groupOf = {};
  var partOf = {};

  var currentTab = 'map';
  var sheetOpen = false;
  var sheetList = [];      /* 抽屉内上一篇/下一篇的遍历顺序 */
  var sheetIdx = -1;
  var curId = '';

  /* ───────── 小工具 ───────── */

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function fetch0(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 1500);
  }

  /* 上报界面状态给安卓容器（只为硬件返回键服务） */
  function pushState() {
    try {
      console.log('AJSTATE:' + JSON.stringify({ sheet: sheetOpen, tab: currentTab }));
    } catch (e) {}
  }

  /* ───────── 收藏 ───────── */

  function readFav() {
    try {
      var a = JSON.parse(fetch0(FAV_KEY) || '[]');
      return a && a.length !== undefined ? a : [];
    } catch (e) { return []; }
  }
  function isFav(id) { return readFav().indexOf(id) >= 0; }
  function toggleFav(id) {
    var a = readFav();
    var i = a.indexOf(id);
    if (i >= 0) { a.splice(i, 1); } else { a.push(id); }
    store(FAV_KEY, JSON.stringify(a));
    return i < 0;
  }

  /* ───────── 字号 ───────── */

  var FS = ['s', 'm', 'l'];
  var FS_LABEL = { s: '小', m: '中', l: '大' };
  function applyFs(v) {
    if (FS.indexOf(v) < 0) { v = 'm'; }
    document.documentElement.setAttribute('data-fs', v);
    store(FS_KEY, v);
  }
  function cycleFs() {
    var cur = fetch0(FS_KEY) || 'm';
    var i = FS.indexOf(cur);
    var next = FS[(i + 1) % FS.length];
    applyFs(next);
    toast('字号：' + FS_LABEL[next]);
  }

  /* ───────── 搜索匹配 ───────── */

  function hay(c) {
    return [c.name, c.alias, c.tag, c.def, c.ai, c.why].join(' \u0001 ').toLowerCase();
  }
  function match(c, kws) {
    var h = hay(c);
    for (var i = 0; i < kws.length; i++) {
      if (h.indexOf(kws[i]) < 0) { return false; }
    }
    return true;
  }
  function parseKw(q) {
    var s = String(q || '').trim().toLowerCase();
    if (!s) { return []; }
    return s.split(/\s+/);
  }

  /* 给命中关键词加 <mark>（先转义再高亮，避免注入） */
  function hl(text, kws) {
    var out = esc(text);
    if (!kws || !kws.length) { return out; }
    for (var i = 0; i < kws.length; i++) {
      var k = esc(kws[i]);
      if (!k) { continue; }
      out = out.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
        function (m) { return '\u0002' + m + '\u0003'; });
    }
    out = out.replace(/\u0002/g, '<mark>').replace(/\u0003/g, '</mark>');
    return out;
  }

  /* ───────── 渲染：地图 ───────── */

  function renderChips() {
    var h = '';
    for (var i = 0; i < G.length; i++) {
      var g = G[i];
      var acc = partOf[g.part] === 'amber' ? 'amber' : 'cyan';
      h += '<button class="chip ' + acc + '" data-goto="' + g.id + '">'
        + esc(g.chip) + '</button>';
    }
    $('chips').innerHTML = h;
  }

  function renderMap() {
    var h = '';
    for (var p = 0; p < P.length; p++) {
      var part = P[p];
      h += '<div class="parthead ' + part.accent + '">'
        + '<span class="badge">' + esc(part.badge) + '</span>'
        + '<h2>' + esc(part.name) + '</h2>'
        + '<div class="pdesc">' + esc(part.desc) + '</div>'
        + '</div>';

      var gs = [];
      for (var i = 0; i < G.length; i++) { if (G[i].part === part.id) { gs.push(G[i]); } }

      for (var j = 0; j < gs.length; j++) {
        h += lineCardHtml(gs[j], part.accent);
        if (j < gs.length - 1) {
          h += '<div class="arrow"><i>↓</i>下一步</div>';
        }
      }
    }
    $('map').innerHTML = h;
  }

  function lineCardHtml(g, accent) {
    var h = '<div class="linecard ' + accent + '" id="lc-' + g.id + '">';
    h += '<div class="linecard-hd">'
      + '<span class="no">' + esc(g.no) + '</span>'
      + '<span class="nm">' + esc(g.name) + '</span>'
      + '<span class="sb">' + esc(g.sub) + '</span>'
      + '</div><div class="nodes">';
    for (var i = 0; i < C.length; i++) {
      if (C[i].g !== g.id) { continue; }
      h += '<div class="node" data-id="' + C[i].id + '">'
        + '<span class="nm">' + esc(C[i].name) + '</span>'
        + (C[i].alias ? '<span class="al">' + esc(C[i].alias) + '</span>' : '')
        + '</div>';
    }
    h += '</div></div>';
    return h;
  }

  /* ───────── 渲染：列表 / 收藏 / 搜索 ───────── */

  function itemHtml(c, kws) {
    return '<div class="item" data-id="' + c.id + '">'
      + '<div class="it-l">'
      + '<div class="it-n">' + hl(c.name, kws) + '</div>'
      + (c.alias ? '<div class="it-a">' + hl(c.alias, kws) + '</div>' : '')
      + '<div class="it-d">' + hl(c.def, kws) + '</div>'
      + '</div>'
      + '<div class="it-r">' + (isFav(c.id) ? '<span class="star">★</span>' : '') + '</div>'
      + '</div>';
  }

  function renderList() {
    var h = '';
    for (var p = 0; p < P.length; p++) {
      var part = P[p];
      for (var i = 0; i < G.length; i++) {
        if (G[i].part !== part.id) { continue; }
        h += '<div class="sect">' + esc(part.badge + ' · ' + G[i].name) + '</div>';
        for (var k = 0; k < C.length; k++) {
          if (C[k].g === G[i].id) { h += itemHtml(C[k], null); }
        }
      }
    }
    $('list').innerHTML = h;
  }

  function renderFav() {
    var fav = readFav();
    if (!fav.length) {
      $('fav').innerHTML = '<div class="empty"><span class="big">☆</span>'
        + '还没有收藏。<br>在任意概念页点右上角的星号，就会收进这里。'
        + '</div>';
      return;
    }
    var h = '';
    for (var i = 0; i < fav.length; i++) {
      var c = byId[fav[i]];
      if (c) { h += itemHtml(c, null); }
    }
    $('fav').innerHTML = h;
  }

  function renderSearch(kw) {
    var kws = parseKw(kw);
    var hit = [];
    for (var i = 0; i < C.length; i++) { if (match(C[i], kws)) { hit.push(C[i]); } }

    if (!hit.length) {
      $('searchInfo').textContent = '没有匹配「' + kw + '」的概念';
      $('results').innerHTML = '<div class="empty"><span class="big">⌕</span>'
        + '换个词试试。<br>可以搜中文名、英文名（如 CU / DOF）、分类（如 剪辑）。</div>';
      return;
    }
    $('searchInfo').textContent = '找到 ' + hit.length + ' 个概念';
    var h = '';
    for (var j = 0; j < hit.length; j++) {
      var g = groupOf[hit[j].g];
      h += '<div class="sect">' + esc(g ? g.name : '') + '</div>' + itemHtml(hit[j], kws);
    }
    $('results').innerHTML = h;
  }

  /* ───────── 视图切换 ───────── */

  function showTab(tab) {
    currentTab = tab;
    $('viewMap').hidden = tab !== 'map';
    $('viewList').hidden = tab !== 'list';
    $('viewFav').hidden = tab !== 'fav';
    $('viewSearch').hidden = tab !== 'search';

    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].getAttribute('data-tab') === tab;
      tabs[i].className = on ? 'tab active' : 'tab';
    }
    if (tab === 'fav') { renderFav(); }
    $('main').scrollTop = 0;
    pushState();
  }

  /* ───────── 抽屉 ───────── */

  function openSheet(id, list) {
    var c = byId[id];
    if (!c) { return; }
    if (list && list.length) {
      sheetList = list;
    } else {
      sheetList = allIds;
    }
    sheetIdx = sheetList.indexOf(id);
    curId = id;
    paintSheet(c);

    store(LAST_KEY, id);
    renderResume();

    if (!sheetOpen) {
      $('mask').hidden = false;
      $('sheet').hidden = false;
      void $('sheet').offsetHeight;      /* 强制回流，让过渡生效 */
      $('mask').className = 'mask show';
      $('sheet').className = 'sheet show';
      sheetOpen = true;
      pushState();
    }
  }

  function paintSheet(c) {
    $('sName').textContent = c.name;
    $('sAlias').textContent = c.alias || '';
    $('sTag').textContent = c.tag || '';

    $('sDef').innerHTML = hl(c.def, null);

    var hasAi = !!(c.ai && c.ai.length);
    $('sAiBox').hidden = !hasAi;
    if (hasAi) { $('sAi').innerHTML = hl(c.ai, null); }

    var hasWhy = !!(c.why && c.why.length);
    $('sWhyBox').hidden = !hasWhy;
    if (hasWhy) { $('sWhy').innerHTML = hl(c.why, null); }

    var fav = isFav(c.id);
    var fb = $('sFav');
    fb.textContent = fav ? '★' : '☆';
    fb.className = fav ? 'iconbtn on' : 'iconbtn';

    $('sBody').scrollTop = 0;
  }

  function closeSheet() {
    if (!sheetOpen) { return; }
    $('sheet').className = 'sheet';
    $('mask').className = 'mask';
    sheetOpen = false;
    pushState();
    setTimeout(function () {
      $('sheet').hidden = true;
      $('mask').hidden = true;
    }, 300);
  }

  function stepSheet(d) {
    if (sheetIdx < 0 || !sheetList.length) { return; }
    var n = sheetIdx + d;
    if (n < 0) { n = sheetList.length - 1; }
    if (n >= sheetList.length) { n = 0; }
    openSheet(sheetList[n], sheetList);
  }

  /* 组装「可粘进 AI 工具」的纯文本 */
  function buildText(c) {
    var lines = [c.name + (c.alias ? '（' + c.alias + '）' : '')];
    if (c.def) { lines.push('定义：' + c.def); }
    if (c.ai) { lines.push('AI 里动哪一下：' + c.ai); }
    if (c.why) { lines.push('为什么必须在乎：' + c.why); }
    return lines.join('\n');
  }

  function copyCur() {
    var c = byId[curId];
    if (!c) { return; }
    var text = buildText(c);

    /* 通道一（主）：交给安卓容器写系统剪贴板。
       WebView 自己 execCommand('copy') 在部分机型/权限下静默失效，不可靠。 */
    var viaApp = false;
    try {
      console.log('AJCOPY:' + encodeURIComponent(text));
      viaApp = true;
    } catch (e0) { }

    /* 通道二（兜底）：WebView 自身复制 */
    var viaWeb = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      viaWeb = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e1) { viaWeb = false; }

    toast((viaApp || viaWeb) ? '已复制 · 可直接粘进 AI 工具' : '复制失败，长按选中文字手动复制');
  }

  /* ───────── 上次查看 ───────── */

  function renderResume() {
    var last = fetch0(LAST_KEY);
    var c = last ? byId[last] : null;
    if (!c) { $('resumeBox').innerHTML = ''; return; }
    $('resumeBox').innerHTML = '<div class="resume" data-id="' + c.id + '">'
      + '继续上次：<b>' + esc(c.name) + '</b></div>';
  }

  /* ───────── 事件绑定 ─────────
   * 所有可点元素统一走一套代理，元素只用 data-* 声明意图：
   *   data-act="tab|fs|qclear|close|mask|prev|next|copy|fav"
   *   data-goto="分组id"    data-id="概念id"
   * 优先用 touchend（安卓 WebView 里比 click 可靠，且没有 300ms 延迟），
   * click 作为非触摸输入的兜底，用时间戳去重，避免一次点击触发两遍。 */

  function findAction(node) {
    var t = node;
    while (t && t !== document.body) {
      if (t.getAttribute) {
        if (t.getAttribute('data-act') || t.getAttribute('data-goto') || t.getAttribute('data-id')) {
          return t;
        }
      }
      t = t.parentNode;
    }
    return null;
  }

  function gotoGroup(gid) {
    var el = $('lc-' + gid);
    if (!el) { return; }
    var m = $('main');
    var y = el.getBoundingClientRect().top + m.scrollTop - 56;
    m.scrollTo(0, y > 0 ? y : 0);
  }

  function toggleCurFav() {
    if (!curId) { return; }
    var on = toggleFav(curId);
    paintSheet(byId[curId]);
    toast(on ? '已收藏' : '已取消收藏');
  }

  /* 点概念时决定抽屉里「上一个/下一个」的遍历范围 */
  function openById(id) {
    if (!byId[id]) { return; }
    if (currentTab === 'map' && $('viewMap').hidden === false) {
      openSheet(id, idsOfGroup(byId[id].g));
    } else {
      openSheet(id, idsInListContext(id));
    }
  }

  function runAction(el) {
    var act = el.getAttribute('data-act');
    if (act === 'tab') { showTab(el.getAttribute('data-tab')); return true; }
    if (act === 'fs') { cycleFs(); return true; }
    if (act === 'qclear') {
      $('q').value = ''; $('qclear').hidden = true; showTab('map'); return true;
    }
    if (act === 'close' || act === 'mask') { closeSheet(); return true; }
    if (act === 'prev') { stepSheet(-1); return true; }
    if (act === 'next') { stepSheet(1); return true; }
    if (act === 'copy') { copyCur(); return true; }
    if (act === 'fav') { toggleCurFav(); return true; }

    var gid = el.getAttribute('data-goto');
    if (gid) { gotoGroup(gid); return true; }

    var nid = el.getAttribute('data-id');
    if (nid) { openById(nid); return true; }

    return false;
  }

  var lastActAt = 0;
  var tX = 0, tY = 0, tT = 0;

  function bind() {
    /* 搜索框：输入即搜（这个必须用原生 input 事件） */
    $('q').oninput = function () {
      var v = $('q').value;
      $('qclear').hidden = !v;
      if (String(v).trim()) { renderSearch(v); showTab('search'); }
      else { showTab('map'); }
    };

    /* 记录按下位置：用来把「滑动」和「点击」分开 */
    document.addEventListener('touchstart', function (e) {
      if (!e.touches || !e.touches.length) { return; }
      tX = e.touches[0].clientX;
      tY = e.touches[0].clientY;
      tT = Date.now();
    }, true);

    document.addEventListener('touchend', function (e) {
      var p = e.changedTouches && e.changedTouches[0];
      if (!p) { return; }
      if (Math.abs(p.clientX - tX) > 12 || Math.abs(p.clientY - tY) > 12) { return; }
      if (Date.now() - tT > 700) { return; }
      var el = findAction(e.target);
      if (el && runAction(el)) { lastActAt = Date.now(); }
    }, true);

    /* 兜底：非触摸输入（鼠标/键盘），并用时间戳避开 touchend 已处理的那一次 */
    document.addEventListener('click', function (e) {
      if (Date.now() - lastActAt < 600) { return; }
      var el = findAction(e.target);
      if (el) { runAction(el); }
    }, true);
  }

  function idsOfGroup(gid) {
    var a = [];
    for (var i = 0; i < C.length; i++) { if (C[i].g === gid) { a.push(C[i].id); } }
    return a;
  }

  /* 抽屉翻页顺序跟随当前所处列表（搜索结果 / 收藏 / 全部） */
  function idsInListContext(id) {
    var kw = $('q').value;
    if (String(kw).trim()) {
      var kws = parseKw(kw);
      var a = [];
      for (var i = 0; i < C.length; i++) { if (match(C[i], kws)) { a.push(C[i].id); } }
      if (a.indexOf(id) >= 0) { return a; }
    }
    if (currentTab === 'fav') {
      var fav = readFav();
      if (fav.indexOf(id) >= 0) { return fav; }
    }
    return allIds;
  }

  /* ── 供安卓容器调用（硬件返回键） ──
     这两个函数**一律不返回值**（返回 undefined）。
     别改成 return 'closed' 之类：容器若用 loadUrl('javascript:...') 执行，
     字符串返回值会被 WebView 当成新页面加载，整屏变成一页纯文本（全黑）。
     容器侧现在走 evaluateJavascript，但这里也保持不返回，双保险。 */
  window.AJClose = function () {
    if (sheetOpen) { closeSheet(); }
  };
  window.AJHome = function () {
    if (sheetOpen) { closeSheet(); }
    showTab('map');
  };

  /* ───────── 启动 ───────── */

  function boot() {
    $('brandTitle').textContent = DATA.meta.title;
    $('brandSub').textContent = DATA.meta.subtitle + ' · ' + DATA.meta.count;
    $('introBox').textContent = DATA.intro;
    $('outroBox').innerHTML = '<span class="ol">一句话收尾</span>' + esc(DATA.outro);

    for (var i = 0; i < C.length; i++) {
      byId[C[i].id] = C[i];
      allIds.push(C[i].id);
    }
    for (var j = 0; j < G.length; j++) { groupOf[G[j].id] = G[j]; }
    for (var k = 0; k < P.length; k++) { partOf[P[k].id] = P[k].accent; }

    applyFs(fetch0(FS_KEY) || 'm');
    bind();
    renderChips();
    renderMap();
    renderList();
    renderResume();
    showTab('map');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
